---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: my-network-macvlan
spec:
  spec:
    devices:
      requests:
      - name: my-network-macvlan
        exactly:
          deviceClassName: devicenetwork
          allocationMode: ExactCount
          count: 1
          selectors:
          - cel:
              expression: device.attributes["multinetwork.networking.k8s.io"].podNetwork == "my-network" && device.attributes["devicenetwork.io"].deviceConfiguration == "macvlan"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-macvlan
  labels:
    app: demo-macvlan
  annotations:
    required-plugins.noderesource.dev/pod: '["devicenetwork"]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-macvlan
  template:
    metadata:
      labels:
        app: demo-macvlan
    spec:
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      containers:
      - name: alpine
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        command:
        - sleep
        - infinity
      resourceClaims:
      - name: my-network-macvlan
        resourceClaimTemplateName: my-network-macvlan