---
apiVersion: devicenetwork.io/v1alpha1
kind: DeviceNetwork
metadata:
  name: all-network
spec:
  deviceSelectors:
  - name: "all-interfaces"
  deviceConfigurations: 
  - name: "macvlan"
    deviceType: Macvlan
    deviceSelectors:
    - "all-interfaces"
  networkInterfaceConfiguration:
    ipam:
    - provider: Random
      random:
        cidr: "192.168.1.0/24"