---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devicenetwork-cluster-role
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["devicenetwork.io"]
  resources: ["devicenetworks"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims/status"]
  verbs: ["update", "patch", "get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devicenetwork-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devicenetwork-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devicenetwork-cluster-role
subjects:
- kind: ServiceAccount
  name: devicenetwork-service-account
  namespace: default
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: devicenetwork
  labels:
    app: devicenetwork
spec:
  selector:
    matchLabels:
      app: devicenetwork
  template:
    metadata:
      labels:
        app: devicenetwork
    spec:
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      serviceAccountName: devicenetwork-service-account
      hostNetwork: true
      hostPID: true
      containers:
      - name: devicenetwork
        image: localhost:5000/devicenetwork/devicenetwork:latest
        imagePullPolicy: Always
        command:
        - ./devicenetwork
        args:
        - "run"
        - "--plugin-index=53"
        - "--node-name=$(NODE_NAME)"
        - "--verbosity=1"
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: cri-socket
          mountPath: /var/run/nri/nri.sock
        - name: hostroot
          mountPath: /hostroot
          mountPropagation: HostToContainer
        - name: host-run-netns
          mountPath: /run/netns
          mountPropagation: HostToContainer
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: plugins
          mountPath: /var/lib/kubelet/plugins
      volumes:
      - name: cri-socket
        hostPath:
          path: /var/run/nri/nri.sock
          type: Socket
      - name: hostroot
        hostPath:
          path: /
      - name: host-run-netns
        hostPath:
          path: /run/netns/
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
      - name: plugins
        hostPath:
          path: /var/lib/kubelet/plugins